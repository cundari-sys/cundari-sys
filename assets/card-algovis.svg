<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="AlgoVis - AlgoVision.OS  //  algorithm visualizer">
<defs>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00F0FF"/><stop offset="1" stop-color="#FF2BD6"/>
  </linearGradient>
  <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b0836"/><stop offset="1" stop-color="#0A0014"/>
  </linearGradient>
  <radialGradient id="o" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00F0FF" stop-opacity="0.45"/><stop offset="1" stop-color="#00F0FF" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="6" y="6" width="388" height="248" rx="18"/></clipPath>
  <filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="6" y="6" width="388" height="248" rx="18" fill="url(#f)"/>
<g clip-path="url(#c)">
  <circle r="120" fill="url(#o)"><animate attributeName="cx" values="340;300;340" dur="7s" repeatCount="indefinite"/><animate attributeName="cy" values="40;90;40" dur="6s" repeatCount="indefinite"/></circle>
  <rect x="-80" y="0" width="60" height="260" fill="#fff" opacity="0.06" transform="skewX(-20)">
    <animate attributeName="x" values="-80;480" dur="4.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="6" y="6" width="388" height="248" rx="18" fill="none" stroke="url(#b)" stroke-width="2.5" stroke-dasharray="200 120">
  <animate attributeName="stroke-dashoffset" values="0;-1280" dur="6s" repeatCount="indefinite"/>
</rect>
<g transform="translate(30 34)" filter="url(#gl)"><rect x="0" y="22" width="9" height="22" rx="2" fill="#00F0FF"><animate attributeName="height" values="22;38;22" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="22;6;22" dur="1.4s" repeatCount="indefinite"/></rect>
<rect x="14" y="10" width="9" height="34" rx="2" fill="#FF2BD6"><animate attributeName="height" values="34;14;34" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="10;30;10" dur="1.1s" repeatCount="indefinite"/></rect>
<rect x="28" y="28" width="9" height="16" rx="2" fill="#B026FF"><animate attributeName="height" values="16;32;16" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="28;12;28" dur="1.7s" repeatCount="indefinite"/></rect>
<rect x="42" y="4" width="9" height="40" rx="2" fill="#39FF14"><animate attributeName="height" values="40;20;40" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="4;24;4" dur="1.25s" repeatCount="indefinite"/></rect></g>
<text x="96" y="52" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="12" letter-spacing="3" fill="#00F0FF">[ PROJECT 01 ]</text>
<text x="96" y="82" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="25" fill="#FFFFFF">AlgoVis</text>
<text x="30" y="124" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="13" fill="#FF2BD6" letter-spacing="1">AlgoVision.OS  //  algorithm visualizer</text>
<text x="30" y="152" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#C9D1D9">Watch sorting and pathfinding algorithms</text>
<text x="30" y="173" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#C9D1D9">run step by step with fluid animations.</text>
<g><rect x="30" y="202" width="104" height="26" rx="13" fill="none" stroke="#00F0FF" stroke-opacity="0.8"/><text x="82" y="219" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#00F0FF">Algorithms</text><animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="0s" repeatCount="indefinite"/></g>
<g><rect x="142.0" y="202" width="129" height="26" rx="13" fill="none" stroke="#00F0FF" stroke-opacity="0.8"/><text x="206" y="219" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#00F0FF">Visualization</text><animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="0s" repeatCount="indefinite"/></g>
<g><rect x="278.6" y="202" width="38" height="26" rx="13" fill="none" stroke="#00F0FF" stroke-opacity="0.8"/><text x="298" y="219" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11.5" fill="#00F0FF">UI</text><animate attributeName="opacity" values="0.65;1;0.65" dur="3s" begin="0s" repeatCount="indefinite"/></g>
</svg>