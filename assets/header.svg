    <stop offset="0.5" stop-color="#FF2BD6"><animate attributeName="stop-color" values="#FF2BD6;#B026FF;#00F0FF;#FF2BD6" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#B026FF"><animate attributeName="stop-color" values="#B026FF;#00F0FF;#FF2BD6;#B026FF" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
