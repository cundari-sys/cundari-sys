<rect x="17" y="32" width="22" height="14" rx="3" fill="none" stroke="#B026FF" stroke-width="2.5"/>
<path d="M22 11H34M11 18V26H28V32M45 18V26H28" fill="none" stroke="#39FF14" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.5s" repeatCount="indefinite"/></path></g>
