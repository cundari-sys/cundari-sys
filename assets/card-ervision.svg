<text x="30" y="152" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#C9D1D9">Design ER diagrams visually and turn</text>
<text x="30" y="173" font-family="'SF Pro Display','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#C9D1D9">them into clean relational schemas.</text>
